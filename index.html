<!DOCTYPE html><html lang='es'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><link rel='stylesheet' href='css/style.css'><title>EagleMc Launcher</title></head><body>
<div class='app'>
<aside class='sidebar'>
<div class='brand'>E</div>
<button id="inicio">Inicio</button>
<button id="servidores">Servidores</button>
<button id="noticias">Noticias</button>
<button id="ajustes">Ajustes</button>
<button id="creditos">Créditos</button>
</aside>
<main class='main'>
<section class='hero' id="contenido">

<h1>EAGLEMC LAUNCHER</h1>

<p>Selecciona tu versión de Eaglercraft</p>

<div class="version-area">

<select id="version">

<option value="eagle.mc.1.8.9.html">
Minecraft 1.8.9
</option>

<option value="eagle.mc.1.12.2.html">
Minecraft 1.12.2
</option>

</select>

<button id="play">
▶ JUGAR
</button>

</div>

</section>


<div class='grid' id="tarjetas">

<div class='card'>
<h2>Noticias</h2>
<div id='news'>Preparado...</div>
</div>

<div class='card'>
<h2>Servidores</h2>
<div id='servers'>Preparado...</div>
</div>

<div class='card'>
<h2>Estado</h2>
<p>Listo.</p>
</div>

<div class='card'>
<h2>Perfil</h2>
<p>Vacío.</p>
</div>

</div>


<div id="seccion"></div></main></div><script src='js/launcher.js'></script></body></html>
